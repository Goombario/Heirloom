[package]
name = "heirloom"
version = "0.0.0"
description = "Heirloom — local-first family tree"
authors = ["the maintainer"]
license = "AGPL-3.0-or-later"
edition = "2021"

[[bin]]
name = "heirloom"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Desktop updates (#24): the updater is registered only when a build carries its
# signing public key (see main.rs); process restarts the app after an install.
tauri-plugin-updater = "~2.12"
tauri-plugin-process = "~2.3"
