name: Container Image

# Each release tag publishes the server image to GitHub Container Registry (#72),
# so a self-hoster can run Heirloom from `ghcr.io/goombario/heirloom` without a
# fork: Railway, or any Docker host, pulls it straight from the registry.
#
# The same rules as the desktop release: the tag must match package.json and be
# on `main`. `vX.Y.Z` is pushed as `X.Y.Z`, `X.Y` and `latest`; a test build
# `vX.Y.Z-rc.N` only as `X.Y.Z-rc.N`, so it never becomes `latest`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag and work out the image tags
        id: tags
        run: |
          tag="$GITHUB_REF_NAME"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error file=package.json::Tag $tag does not match package.json ($version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag is not on main. Release only commits that merged into main."
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/heirloom"
          plain="${tag#v}"
          if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags="$image:$plain,$image:${BASH_REMATCH[1]}.${BASH_REMATCH[2]},$image:latest"
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            tags="$image:$plain"
          else
            echo "::error::Tag $tag is neither a release (vX.Y.Z) nor a test build (vX.Y.Z-rc.N)."
            exit 1
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$plain" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No secrets go in: the Dockerfile reads only the optional About page build
      # facts. SOURCE_URL stays unset, so the About page links the upstream source
      # (AGPL section 13) and HEIRLOOM_HOSTED stays unset ("Self-hosted server").
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=Heirloom
